<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小红书热门笔记数据分析报告</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 16px;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .report-header {
            background: linear-gradient(135deg, #ff2442 0%, #ff6b81 100%);
            color: white;
            padding: 20px 24px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .report-header h1 {
            font-size: 20px;
            margin-bottom: 8px;
        }
        .report-header .keyword {
            font-size: 14px;
            opacity: 0.9;
        }
        .report-header .total {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 4px;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }
        .card-title-row {
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 10px;
            display: flex;
            align-items: flex-start;
            gap: 6px;
        }
        .card-index {
            font-size: 15px;
            font-weight: 700;
            color: #ff2442;
            min-width: 20px;
        }
        .card-title {
            font-size: 15px;
            font-weight: 700;
            color: #1a1a1a;
            text-decoration: none;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: color 0.2s;
        }
        .card-title:hover {
            color: #ff2442;
        }
        .card-meta {
            font-size: 13px;
            color: #999;
            padding: 8px 0;
        }
        .author-link {
            color: #666;
            text-decoration: none;
            transition: color 0.2s;
        }
        .author-link:hover {
            color: #ff2442;
        }
        .meta-divider {
            margin: 0 6px;
        }
        .pub-time {
            color: #999;
        }
        .card-scores {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .score-tag {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 500;
        }
        .score-tag.relevance {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .score-tag.popularity {
            background: #fff3e0;
            color: #e65100;
        }
        .score-tag.recency {
            background: #e3f2fd;
            color: #1565c0;
        }
        .card-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            margin: 0 -16px;
            background: linear-gradient(135deg, #fff5f5, #fff);
        }
        .interaction-count {
            font-size: 14px;
            font-weight: 600;
            color: #ff2442;
        }
        .detail-stats {
            font-size: 12px;
            color: #666;
        }
        .view-note-btn {
            color: #ff2442;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: opacity 0.2s;
        }
        .view-note-btn:hover {
            opacity: 0.7;
            text-decoration: underline;
        }
        .data-note {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 20px;
            padding: 12px;
            background: white;
            border-radius: 8px;
        }
        .section-header {
            margin-top: 24px;
            margin-bottom: 16px;
            padding: 12px 16px;
            background: linear-gradient(135deg, #ff6b81 0%, #ff2442 100%);
            border-radius: 8px;
        }
        .section-header h2 {
            color: white;
            font-size: 16px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="report-header">
            <h1>小红书热门笔记数据分析报告</h1>
            <div class="keyword">关键词：网申截止 | 时间范围：近30天</div>
            <div class="total">共找到 1 条相关笔记</div>
        </div>

        
        <div class="card-grid">
            
        <div class="card">
            <div class="card-title-row">
                <span class="card-index">1.</span>
                <a href="https://www.xiaohongshu.com/explore/6ac4ad630000000018039ca1" class="card-title" target="_blank">国庆后网申截止的公司有点多呀！</a>
            </div>
            <div class="card-meta">
                <a href="https://www.xiaohongshu.com/user/profile/5dc2bab5000000000100243b" class="author-link" target="_blank">不知名校招宝藏博主（1w+粉）</a>
                <span class="meta-divider">·</span>
                <span class="pub-time">发布日期：10月6日</span>
            </div>
            
            <div class="card-scores">
                <span class="score-tag relevance">相关性 10.0</span>
                <span class="score-tag popularity">热度 1.0</span>
                <span class="score-tag recency">时效 1.5</span>
            </div>
            
            <div class="card-stats">
                <span class="interaction-count">🔥 2086互动</span>
                <span class="detail-stats">👍947 ⭐1070</span>
                <a href="https://www.xiaohongshu.com/explore/6ac4ad630000000018039ca1" class="view-note-btn" target="_blank">查看作品 ↗</a>
            </div>
        </div>
        
        </div>

        

        <div class="data-note">
            数据来源：小红书热门笔记搜索，每日更新最新热门内容<br>
            备注：互动数据为入库快照，实时数据可能持续增长
        </div>
    </div>
</body>
</html>
