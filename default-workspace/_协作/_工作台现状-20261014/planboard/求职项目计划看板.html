<style data-page-node-id="wDG0oONVEzQjreoCuxLuzX" data-pnid-children="X4hDg65j9UWkduyj35Ina2">
  :root{
    --bg:#f5f6f8; --card:#ffffff; --ink:#1f2329; --sub:#646a73;
    --line:#e5e6eb; --brand:#3370ff; --brand-weak:#eaf1ff;
    --ok:#00a35f; --ok-weak:#e6f7f0; --warn:#ff8800; --warn-weak:#fff3e5;
    --danger:#f54a45; --danger-weak:#feeceb; --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 16px 48px;}
  h1{font-size:20px;margin-bottom:2px;}
  .subline{color:var(--sub);font-size:12px;margin-bottom:18px;}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
  .kpi .label{font-size:12px;color:var(--sub);}
  .kpi .num{font-size:26px;font-weight:700;margin-top:2px;}
  .kpi .foot{font-size:11px;color:var(--sub);margin-top:2px;}
  .kpi.good .num{color:var(--ok);} .kpi.bad .num{color:var(--danger);} .kpi.brand .num{color:var(--brand);}
  section{margin-bottom:22px;}
  h2{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  h2 .tag{font-size:11px;font-weight:400;color:var(--sub);background:var(--brand-weak);color:var(--brand);padding:1px 8px;border-radius:10px;}
  .goal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  .goal{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:var(--radius);padding:14px 16px;}
  .goal .t{font-weight:600;}
  .goal .meta{font-size:12px;color:var(--sub);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;}
  .week-board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .wcol{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;}
  .wcol.cur{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-weak);}
  .wcol h3{font-size:13px;margin-bottom:8px;}
  .wcol .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:10px;}
  .wcol .bar i{display:block;height:100%;background:var(--ok);border-radius:3px;}
  .witem{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:13px;}
  .witem.done{background:var(--ok-weak);border-color:transparent;}
  .witem .meta{font-size:11px;color:var(--sub);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;}
  .day-group{margin-bottom:14px;}
  .day-group .gt{font-size:13px;font-weight:600;margin-bottom:8px;color:var(--sub);}
  .day-group.overdue .gt{color:var(--danger);}
  .todo{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .todo.late{border-left:4px solid var(--danger);}
  .todo.today{border-left:4px solid var(--brand);}
  .todo.future{border-left:4px solid var(--line);}
  .todo .t{flex:1 1 320px;font-weight:500;}
  .todo.done .t{text-decoration:line-through;color:var(--sub);}
  .pill{font-size:11px;padding:1px 8px;border-radius:10px;white-space:nowrap;}
  .pill.s-dai{background:var(--brand-weak);color:var(--brand);}
  .pill.s-jin{background:var(--warn-weak);color:var(--warn);}
  .pill.s-wan{background:var(--ok-weak);color:var(--ok);}
  .pill.s-shun{background:var(--danger-weak);color:var(--danger);}
  .todo .meta{font-size:11px;color:var(--sub);display:flex;gap:8px;flex-wrap:wrap;}
  .todo .ops{display:flex;gap:6px;}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--ink);}
  .btn:hover{border-color:var(--brand);color:var(--brand);}
  .btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;}
  .btn.pri:hover{opacity:.9;color:#fff;}
  form.add{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
  .frow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:10px;}
  .frow label{font-size:12px;color:var(--sub);display:block;margin-bottom:4px;}
  .frow input,.frow select,.frow textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink);}
  .frow .full{grid-column:1 / -1;}
  .msg{font-size:13px;margin-top:8px;min-height:18px;}
  .msg.ok{color:var(--ok);} .msg.err{color:var(--danger);}
  .empty{color:var(--sub);font-size:13px;padding:10px 2px;}
  .footer-note{font-size:11px;color:var(--sub);margin-top:8px;}
  @media(max-width:640px){
    .kpis{grid-template-columns:1fr 1fr;}
    .goal-grid,.week-board{grid-template-columns:1fr;}
    .frow{grid-template-columns:1fr;}
  }
</style>

<script data-page-node-id="tOgtgS3s1KyMKkveFjsLcJ" data-pnid-children="Z1F3Axub8O40UCYSZXyzcL">
(function() {
  var db = (typeof window !== 'undefined' && typeof window.__SMART_PAGE__ !== 'undefined' && window.__SMART_PAGE__ && window.__SMART_PAGE__.database) ? window.__SMART_PAGE__.database : null;
  if (!db) {
    // 无 SDK 环境（离线预览/老环境）：降级为静态空状态，不白屏
    var ids = ['kpi-rate', 'kpi-rate-foot', 'kpi-today', 'kpi-late'];
    ids.forEach(function(id) { var el = document.getElementById(id); if (el) el.textContent = '--'; });
    ['goal-list', 'week-board', 'list-late', 'list-today', 'list-future'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el && !el.children.length) {
        var e = document.createElement('div');
        e.className = 'empty'; e.textContent = '数据加载环境不可用，请在 WorkBuddy 内打开本页';
        el.appendChild(e);
      }
    });
    return;
  }
  var DATABASE_ID = 'hbb5VOa9AbbGmepzoYiwRL';
  var SCHEMA_OPTIONS = {};   // { fieldName: [{text, id}] }
  var ROWS = [];             // 全量记录
  var CARRY_DONE = {};       // 本轮已处理顺延的 recordId

  function escDate(d) {
    var p = function(n){ return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  var TODAY = escDate(new Date());
  document.getElementById('today-label').textContent = '今天是 ' + TODAY;

  function optId(field, text) {
    var list = SCHEMA_OPTIONS[field] || [];
    for (var i = 0; i < list.length; i++) { if (list[i].text === text) return list[i].id; }
    return '';
  }
  function optText(field, val) {
    if (val === null || val === undefined) return '';
    if (typeof val === 'object') { if (Array.isArray(val)) return val.map(function(v){return v.text || v;}).join('、'); return val.text || ''; }
    return String(val);
  }

  db.getSchema({ databaseId: DATABASE_ID }).then(function(schema) {
    (schema.properties || []).forEach(function(field) {
      if ((field.type === 'select' || field.type === 'multi_select') && field.config && field.config.options) {
        SCHEMA_OPTIONS[field.name] = field.config.options;
      }
    });
    renderSelectOptions();
    return loadData();
  }).catch(function(err) { console.error('[database] schema 加载失败:', err); return loadData(); });

  function loadData(startCursor, acc, guard) {
    acc = acc || [];
    guard = guard || 0;
    if (guard > 100) { renderAll(acc); return Promise.resolve(); }
    return db.query({
      databaseId: DATABASE_ID,
      sorts: [{ property: '计划日期', direction: 'ascending' }],
      pageSize: 200,
      startCursor: startCursor
    }).then(function(result) {
      acc = acc.concat(result.results || []);
      var next = result.nextCursor;
      if (result.hasMore && next && next !== startCursor && (result.results || []).length) {
        return loadData(next, acc, guard + 1);
      }
      renderAll(acc);
    }).catch(function(err) { console.error('[database] 数据加载失败:', err); });
  }

  function renderSelectOptions() {
    var conf = [
      ['level', '层级'], ['week', '所属周'], ['status', '状态'], ['owner', '负责人']
    ];
    conf.forEach(function(pair) {
      var sel = document.querySelector('[name="' + pair[0] + '"]');
      if (!sel) return;
      (SCHEMA_OPTIONS[pair[1]] || []).forEach(function(opt) {
        var o = document.createElement('option');
        o.value = opt.id; o.textContent = opt.text;
        sel.appendChild(o);
      });
    });
  }

  function renderAll(rows) {
    ROWS = rows;
    autoCarryOverdue().then(function() { paint(); });
  }

  // 逾期自动顺延：每日待办 + 计划日期早于今天 + 状态=待办 → 改为「已顺延」
  function autoCarryOverdue() {
    var chain = Promise.resolve();
    ROWS.forEach(function(row) {
      var lvl = optText('层级', row['层级']);
      var st = optText('状态', row['状态']);
      var d = row['计划日期'] || '';
      var dateStr = typeof d === 'string' ? d.slice(0, 10) : '';
      if (lvl === '每日待办' && dateStr && dateStr < TODAY && st === '待办' && row.id && !CARRY_DONE[row.id]) {
        CARRY_DONE[row.id] = true;
        chain = chain.then(function() {
          return db.updateRecord({
            databaseId: DATABASE_ID,
            recordId: row.id,
            properties: { '状态': { select: optId('状态', '已顺延') } }
          }).then(function() { row['状态'] = '已顺延'; })
            .catch(function(err) { console.error('[database] 顺延失败:', err); });
        });
      }
    });
    return chain;
  }

  function mkPill(text) {
    var s = document.createElement('span');
    var cls = 'pill';
    if (text === '待办') cls += ' s-dai';
    else if (text === '进行中') cls += ' s-jin';
    else if (text === '已完成') cls += ' s-wan';
    else if (text === '已顺延') cls += ' s-shun';
    s.className = cls; s.textContent = text;
    return s;
  }
  function mkMeta(parts) {
    var m = document.createElement('div'); m.className = 'meta';
    parts.forEach(function(p) {
      var sp = document.createElement('span'); sp.textContent = p; m.appendChild(sp);
    });
    return m;
  }
  function setKpi(id, text) {
    var el = document.getElementById(id);
    el.textContent = text;
    el.setAttribute('data-sp-bindable', 'database');
    el.setAttribute('data-sp-database-id', DATABASE_ID);
  }

  function paint() {
    // ---- KPI ----
    var total = ROWS.length, done = 0, todayCnt = 0, lateCnt = 0;
    var dailyToday = [], dailyLate = [], dailyFuture = [];
    ROWS.forEach(function(row) {
      var lvl = optText('层级', row['层级']);
      var st = optText('状态', row['状态']);
      if (st === '已完成') done++;
      var d = row['计划日期'] || '';
      var dateStr = typeof d === 'string' ? d.slice(0, 10) : '';
      if (lvl === '每日待办') {
        if (dateStr && dateStr < TODAY && st !== '已完成') { lateCnt++; dailyLate.push(row); }
        else if (dateStr === TODAY && st !== '已完成') { todayCnt++; dailyToday.push(row); }
        else if (st !== '已完成' && (!dateStr || dateStr > TODAY)) { dailyFuture.push(row); }
      }
    });
    var rate = total ? Math.round(done * 100 / total) : 0;
    setKpi('kpi-rate', rate + '%');
    setKpi('kpi-rate-foot', '已完成 ' + done + ' / 共 ' + total);
    setKpi('kpi-today', String(todayCnt));
    setKpi('kpi-late', String(lateCnt));

    // ---- 月目标 ----
    var goalList = document.getElementById('goal-list');
    goalList.textContent = '';
    var goals = ROWS.filter(function(r) { return optText('层级', r['层级']) === '月目标'; });
    if (!goals.length) { var e0 = document.createElement('div'); e0.className = 'empty'; e0.textContent = '暂无月目标'; goalList.appendChild(e0); }
    goals.forEach(function(row) {
      var card = document.createElement('div'); card.className = 'goal';
      var t = document.createElement('div'); t.className = 't';
      t.setAttribute('data-f', '任务名');
      t.textContent = optText('任务名', row['任务名']);
      var meta = document.createElement('div'); meta.className = 'meta';
      meta.appendChild(mkPill(optText('状态', row['状态'])));
      var owner = document.createElement('span');
      owner.setAttribute('data-f', '负责人');
      owner.textContent = '负责人：' + optText('负责人', row['负责人']);
      meta.appendChild(owner);
      var note = document.createElement('span');
      note.setAttribute('data-f', '备注');
      note.textContent = optText('备注', row['备注']);
      meta.appendChild(note);
      card.appendChild(t); card.appendChild(meta);
      goalList.appendChild(card);
    });

    // ---- 周任务看板 ----
    var board = document.getElementById('week-board');
    board.textContent = '';
    var weeks = (SCHEMA_OPTIONS['所属周'] || []).map(function(o) { return o.text; });
    var weekRows = ROWS.filter(function(r) { return optText('层级', r['层级']) === '周任务'; });
    var curWeekIdx = -1;
    weeks.forEach(function(w, i) {
      var m = w.match(/(\d{2}\/\d{2})-(\d{2}\/\d{2})/);
      if (m) {
        var start = '2026-' + m[1].replace('/', '-');
        var end = '2026-' + m[2].replace('/', '-');
        if (TODAY >= start && TODAY <= end) curWeekIdx = i;
      }
    });
    weeks.forEach(function(w, wi) {
      var items = weekRows.filter(function(r) { return optText('所属周', r['所属周']) === w; });
      if (!items.length) return;
      var col = document.createElement('div');
      col.className = 'wcol' + (wi === curWeekIdx ? ' cur' : '');
      var h = document.createElement('h3');
      h.textContent = (wi === curWeekIdx ? '▶ ' : '') + w;
      col.appendChild(h);
      var dn = items.filter(function(r) { return optText('状态', r['状态']) === '已完成'; }).length;
      var bar = document.createElement('div'); bar.className = 'bar';
      var fill = document.createElement('i');
      fill.style.width = (items.length ? Math.round(dn * 100 / items.length) : 0) + '%';
      bar.appendChild(fill); col.appendChild(bar);
      items.forEach(function(row) {
        var it = document.createElement('div');
        it.className = 'witem' + (optText('状态', row['状态']) === '已完成' ? ' done' : '');
        var t = document.createElement('div');
        t.setAttribute('data-f', '任务名');
        t.textContent = optText('任务名', row['任务名']);
        it.appendChild(t);
        var meta = document.createElement('div'); meta.className = 'meta';
        meta.appendChild(mkPill(optText('状态', row['状态'])));
        var own = document.createElement('span');
        own.setAttribute('data-f', '负责人');
        own.textContent = optText('负责人', row['负责人']);
        meta.appendChild(own);
        it.appendChild(meta);
        col.appendChild(it);
      });
      board.appendChild(col);
    });
    if (!board.children.length) { var e1 = document.createElement('div'); e1.className = 'empty'; e1.textContent = '暂无周任务'; board.appendChild(e1); }

    // ---- 每日待办 ----
    function fillList(containerId, groupId, rows, cls) {
      var list = document.getElementById(containerId);
      var group = document.getElementById(groupId);
      list.textContent = '';
      group.style.display = rows.length ? '' : 'none';
      rows.forEach(function(row) {
        var st = optText('状态', row['状态']);
        var box = document.createElement('div');
        box.className = 'todo ' + cls + (st === '已完成' ? ' done' : '');
        var t = document.createElement('div'); t.className = 't';
        t.setAttribute('data-f', '任务名');
        t.textContent = optText('任务名', row['任务名']);
        box.appendChild(t);
        var pillWrap = document.createElement('div');
        pillWrap.appendChild(mkPill(st));
        box.appendChild(pillWrap);
        var meta = document.createElement('div'); meta.className = 'meta';
        var dEl = document.createElement('span');
        dEl.setAttribute('data-f', '计划日期');
        var dd = row['计划日期'] || '';
        dEl.textContent = typeof dd === 'string' ? dd.slice(0, 10) : '';
        meta.appendChild(dEl);
        var oEl = document.createElement('span');
        oEl.setAttribute('data-f', '负责人');
        oEl.textContent = optText('负责人', row['负责人']);
        meta.appendChild(oEl);
        var nEl = document.createElement('span');
        nEl.setAttribute('data-f', '备注');
        nEl.textContent = optText('备注', row['备注']);
        meta.appendChild(nEl);
        box.appendChild(meta);
        if (st !== '已完成' && row.id) {
          var ops = document.createElement('div'); ops.className = 'ops';
          var bDone = document.createElement('button'); bDone.className = 'btn pri'; bDone.textContent = '✓ 完成';
          bDone.addEventListener('click', function() { setStatus(row.id, '已完成'); });
          var bToday = document.createElement('button'); bToday.className = 'btn'; bToday.textContent = '⏩ 顺延到今天';
          bToday.addEventListener('click', function() { carryToToday(row.id); });
          ops.appendChild(bDone); ops.appendChild(bToday);
          box.appendChild(ops);
        }
        list.appendChild(box);
      });
      if (!rows.length) {
        var e = document.createElement('div'); e.className = 'empty';
        e.textContent = cls === 'late' ? '无逾期 🎉' : (cls === 'today' ? '今日暂无待办' : '暂无未来待办');
        list.appendChild(e);
      }
    }
    fillList('list-late', 'g-late', dailyLate, 'late');
    fillList('list-today', 'g-today', dailyToday, 'today');
    fillList('list-future', 'g-future', dailyFuture, 'future');
  }

  function setStatus(recordId, statusText) {
    db.updateRecord({
      databaseId: DATABASE_ID,
      recordId: recordId,
      properties: { '状态': { select: optId('状态', statusText) } }
    }).then(function() { loadData(); })
      .catch(function(err) { console.error('[database] 更新失败:', err); });
  }
  function carryToToday(recordId) {
    db.updateRecord({
      databaseId: DATABASE_ID,
      recordId: recordId,
      properties: {
        '计划日期': { date: TODAY },
        '状态': { select: optId('状态', '待办') }
      }
    }).then(function() { loadData(); })
      .catch(function(err) { console.error('[database] 顺延失败:', err); });
  }

  // ---- 新增任务 ----
  var form = document.getElementById('add-form');
  var msg = document.getElementById('form-msg');
  var CACHE_KEY = 'sp_form_cache_' + DATABASE_ID + '_planboard';
  var CACHE_FIELDS = ['task', 'level', 'week', 'planDate', 'owner', 'status', 'note'];
  var cacheTimer = null;
  function saveFormCache() {
    try {
      var data = {};
      CACHE_FIELDS.forEach(function(n) {
        var el = form.querySelector('[name="' + n + '"]');
        if (el) data[n] = el.value;
      });
      localStorage.setItem(CACHE_KEY, JSON.stringify(data));
    } catch (e) { /* 存储不可用时静默降级 */ }
  }
  function restoreFormCache() {
    try {
      var raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return;
      var data = JSON.parse(raw) || {};
      CACHE_FIELDS.forEach(function(n) {
        var el = form.querySelector('[name="' + n + '"]');
        if (el && data[n] !== undefined && data[n] !== null) el.value = data[n];
      });
    } catch (e) { /* 静默降级 */ }
  }
  function clearFormCache() {
    try { localStorage.removeItem(CACHE_KEY); } catch (e) { /* 静默降级 */ }
  }
  if (form) {
    form.addEventListener('input', function() {
      if (cacheTimer) clearTimeout(cacheTimer);
      cacheTimer = setTimeout(saveFormCache, 300);
    });
    form.addEventListener('change', function() {
      if (cacheTimer) clearTimeout(cacheTimer);
      cacheTimer = setTimeout(saveFormCache, 300);
    });
    restoreFormCache();
  }
  if (form) {
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      var submitBtn = form.querySelector('[type="submit"]');
      if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = '提交中...'; }
      var levelSel = form.querySelector('[name="level"]');
      var props = {
        '任务名': { text: form.querySelector('[name="task"]').value },
        '层级': { select: levelSel.value },
        '状态': { select: optId('状态', '待办') }
      };
      var weekSel = form.querySelector('[name="week"]');
      if (weekSel.value) props['所属周'] = { select: weekSel.value };
      var ownerSel = form.querySelector('[name="owner"]');
      if (ownerSel.value) props['负责人'] = { select: ownerSel.value };
      var stSel = form.querySelector('[name="status"]');
      if (stSel.value) props['状态'] = { select: stSel.value };
      var pd = form.querySelector('[name="planDate"]').value;
      if (pd) props['计划日期'] = { date: pd };
      var note = form.querySelector('[name="note"]').value;
      if (note) props['备注'] = { text: note };
      db.addRecord({ databaseId: DATABASE_ID, properties: props })
        .then(function() {
          msg.className = 'msg ok'; msg.textContent = '添加成功';
          clearFormCache();
          form.reset();
          loadData();
        })
        .catch(function(err) { console.error('[database] 提交失败:', err); msg.className = 'msg err'; msg.textContent = '提交失败，请稍后重试'; })
        .then(function() { if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = '添加任务'; } });
    });
  }
})();
</script>
</body>
